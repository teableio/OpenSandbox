name: Runners prune

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Every Monday 01:00 (UTC+8) = Sunday 17:00 UTC
    - cron: '0 17 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-prune:
    name: Runner system prune
    # Upstream's runner fleet only: forks run schedules on their default
    # branch, and this must not prune Docker on anyone else's runners.
    if: github.repository == 'opensandbox-group/OpenSandbox'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Docker system prune
        run: |
          docker system prune -a -f

