name: Build server image

# Manual multi-arch build of opensandbox-server, pushed to GHCR and the
# Shenzhen ACR mirror. Runs on GitHub runners so builds do not depend on
# anyone's local network.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.2.0-fix5)"
        required: true
        type: string
      push_ghcr:
        description: "Also push to GHCR (needs the package's Actions access to include this repo)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Shenzhen ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ inputs.push_ghcr && format('ghcr.io/teableio/opensandbox-server:{0}', inputs.tag) || '' }}
            registry.cn-shenzhen.aliyuncs.com/teable/opensandbox-server:${{ inputs.tag }}

      - name: Inspect manifests
        run: |
          if [ "${{ inputs.push_ghcr }}" = "true" ]; then
            docker buildx imagetools inspect "ghcr.io/teableio/opensandbox-server:${{ inputs.tag }}"
          fi
          docker buildx imagetools inspect "registry.cn-shenzhen.aliyuncs.com/teable/opensandbox-server:${{ inputs.tag }}"
