# Example BatchSandbox CR template for OpenSandbox Kubernetes runtime
# This is a complete BatchSandbox CR template that will be merged with runtime values
#
# Usage in config.toml:
#   [kubernetes]
#   batchsandbox_template_file = "/path/to/this/file.yaml"

# Metadata template (will be merged with runtime-generated metadata)
metadata:
# Spec template
spec:
  replicas: 1
  # Pod template specification
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - operator: "Exists"
      # Container entries are matched onto the runtime-generated containers:
      # volumeMounts, env and securityContext declared on the "sandbox"
      # container (and, for securityContext, on initContainers matched by
      # name) are merged into the pod the server creates. For securityContext,
      # runtime-generated fields win on conflict and capability add/drop lists
      # are unioned, e.g.:
      #   containers:
      #     - name: sandbox
      #       securityContext:
      #         allowPrivilegeEscalation: false
      #         capabilities:
      #           drop: ["ALL"]
      #   initContainers:
      #     - name: execd-installer
      #       securityContext:
      #         allowPrivilegeEscalation: false
